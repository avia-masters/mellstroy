<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Бонусы — MELLSTROY КАЗИНО</title>
    <meta name="description" content="Бонусы и акции MELLSTROY КАЗИНО: приветственный бонус, кэшбэк, фриспины и промокоды. Узнайте условия и забирайте свои подарки.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f7;
            color: #1a2332;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        a {
            color: #2a7de1;
            text-decoration: none;
        }

        a:hover {
            color: #1a5fb4;
        }

        /* ===== ШАПКА ===== */
        .site-header {
            background: #ffffff;
            padding: 12px 0;
            border-bottom: 2px solid #d0d9e6;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            color: #1a2332;
        }

        .brand img {
            height: 44px;
            width: auto;
            display: block;
        }

        .menu-button {
            display: none;
            background: none;
            border: 1px solid #c0cbd8;
            color: #1a2332;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 10px 20px;
            flex-wrap: wrap;
        }

        .main-nav a {
            color: #2c3e5a;
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
        }

        .main-nav a:hover {
            color: #2a7de1;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .age-badge {
            background: #d0d9e6;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            color: #1a2332;
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
        }

        .btn.primary {
            background: #2a7de1;
            color: #ffffff;
        }

        .btn.primary:hover {
            background: #1a5fb4;
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(42, 125, 225, 0.3);
        }

        .btn.ghost {
            background: transparent;
            color: #2c3e5a;
            border: 1px solid #c0cbd8;
        }

        .btn.ghost:hover {
            border-color: #2a7de1;
            color: #2a7de1;
        }

        /* ===== СТРАНИЦА ===== */
        .page-header {
            padding: 40px 0 20px;
        }

        .page-header h1 {
            font-size: 36px;
            color: #1a2332;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #2c3e5a;
            font-size: 18px;
            max-width: 700px;
        }

        .bonus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .bonus-card {
            background: #ffffff;
            border: 1px solid #d0d9e6;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: 0.3s;
            border-left: 5px solid #2a7de1;
        }

        .bonus-card:hover {
            border-color: #2a7de1;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(42, 125, 225, 0.12);
        }

        .bonus-card .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .bonus-card h3 {
            font-size: 22px;
            color: #1a2332;
            margin-bottom: 8px;
        }

        .bonus-card p {
            color: #2c3e5a;
            margin-bottom: 16px;
        }

        .bonus-card .conditions {
            background: #f5f8fc;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .bonus-card .conditions strong {
            display: block;
            color: #1a2332;
            margin-bottom: 4px;
        }

        .bonus-card .conditions span {
            font-size: 14px;
            color: #2c3e5a;
        }

        .bonus-table {
            background: #ffffff;
            border: 1px solid #d0d9e6;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .bonus-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .bonus-table th {
            background: #e6edf5;
            color: #1a2332;
            padding: 14px 20px;
            text-align: left;
            font-weight: 600;
        }

        .bonus-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #d0d9e6;
            color: #1a2332;
        }

        .bonus-table tr:last-child td {
            border-bottom: none;
        }

        /* ===== ФУТЕР ===== */
        .site-footer {
            background: #ffffff;
            padding: 40px 0 20px;
            border-top: 1px solid #d0d9e6;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 30px;
        }

        .footer-brand p {
            color: #2c3e5a;
            font-size: 14px;
            margin: 12px 0;
        }

        .footer-trust {
            display: flex;
            gap: 12px;
        }

        .footer-trust span {
            background: #e6edf5;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #2c3e5a;
        }

        .footer-grid strong {
            color: #1a2332;
            display: block;
            margin-bottom: 10px;
        }

        .footer-grid a {
            display: block;
            color: #2c3e5a;
            font-size: 14px;
            padding: 3px 0;
            transition: 0.3s;
        }

        .footer-grid a:hover {
            color: #2a7de1;
        }

        .footer-bottom {
            border-top: 1px solid #d0d9e6;
            padding-top: 20px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 14px;
            color: #5a6f88;
        }

        .mobile-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #d0d9e6;
            padding: 10px;
            gap: 10px;
            z-index: 200;
        }

        .mobile-bar a {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            font-weight: 600;
        }

        .mobile-bar a:first-child {
            background: transparent;
            border: 1px solid #c0cbd8;
            color: #1a2332;
        }

        .mobile-bar a:last-child {
            background: #2a7de1;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .menu-button {
                display: block;
            }

            .main-nav {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                padding: 16px 0;
                gap: 8px;
            }

            .main-nav.open {
                display: flex;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
                padding-top: 12px;
                border-top: 1px solid #d0d9e6;
            }

            .footer-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .bonus-grid {
                grid-template-columns: 1fr;
            }

            .mobile-bar {
                display: flex;
            }

            .site-footer {
                padding-bottom: 80px;
            }
        }
    </style>
</head>
